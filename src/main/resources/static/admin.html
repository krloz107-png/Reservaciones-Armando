<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Armando's</title>
    <style>
        body { font-family: 'Lato', sans-serif; background-color: #faf7f2; padding: 30px; margin: 0; color: #211810; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #1a5f6e; font-size: 2.3rem; margin: 0; font-family: 'Playfair Display', serif;}
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }

        /* Estilos de la barra de filtros */
        .filters { display: flex; gap: 15px; margin-bottom: 20px; background: #f5ede0; padding: 15px; border-radius: 8px; align-items: flex-end; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 200px; }
        .filter-group label { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: #7a6555; letter-spacing: 1px; }
        .filter-group input, .filter-group select { padding: 8px 10px; border: 1px solid #e8d9c3; border-radius: 4px; font-family: inherit; font-size: 0.9rem; background: white; }
        .btn-reset { background: #b85c38; color: white; border: none; padding: 9px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; transition: background 0.2s; }
        .btn-reset:hover { background: #a24e2e; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e8d9c3; }
        th { background-color: #1a5f6e; color: white; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        tr:hover { background-color: #f5ede0; }
        .badge { background: #b85c38; color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; }
        .no-results { text-align: center; color: #7a6555; padding: 20px; font-style: italic; }
    </style>
</head>
<body>

<div class="header">
    <h1>📊 Reservaciones del Restaurante</h1>
    <p>Control y gestión de mesas de Armando's Pescados y Mariscos</p>
</div>

<div class="container">
    <!-- Controles de Filtro -->
    <div class="filters">
        <div class="filter-group">
            <label for="filtro-fecha">Filtrar por Fecha</label>
            <input type="date" id="filtro-fecha" onchange="aplicarFiltros()">
        </div>
        <div class="filter-group">
            <label for="filtro-horario">Filtrar por Bloque Horario</label>
            <select id="filtro-horario" onchange="aplicarFiltros()">
                <option value="">Todos los horarios</option>
                <option value="manana">Mañana (08:00 - 11:59)</option>
                <option value="tarde">Comida / Tarde (12:00 - 17:59)</option>
                <option value="noche">Cena / Noche (18:00 - 22:00)</option>
            </select>
        </div>
        <div>
            <button class="btn-reset" onclick="limpiarFiltros()">Limpiar Filtros</button>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Contacto</th>
            <th>Lugares</th>
            <th>Fecha y Hora</th>
        </tr>
        </thead>
        <tbody id="tabla-reservas">
        <!-- Javascript llenará esto -->
        </tbody>
    </table>
</div>

<script>
    let todasLasReservas = [];

    async function cargarReservaciones() {
        try {
            const response = await fetch('/api/reservas');
            todasLasReservas = await response.json();
            mostrarEnTabla(todasLasReservas);
        } catch (error) {
            console.error("Error al cargar las reservaciones:", error);
            document.getElementById('tabla-reservas').innerHTML = '<tr><td colspan="5" class="no-results" style="color:red;">No se pudieron cargar las reservaciones.</td></tr>';
        }
    }

    function mostrarEnTabla(reservas) {
        const tbody = document.getElementById('tabla-reservas');
        tbody.innerHTML = '';

        if (reservas.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="no-results">No se encontraron reservaciones con estos filtros.</td></tr>';
            return;
        }

        reservas.forEach(reserva => {
            const fecha = new Date(reserva.fechaHora);
            const fechaTexto = fecha.toLocaleDateString('es-MX', {
                weekday: 'short', day: '2-digit', month: 'short', year: 'numeric'
            });
            const horaTexto = fecha.toLocaleTimeString('es-MX', {
                hour: '2-digit', minute: '2-digit', hour12: false
            });

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>#${reserva.id}</td>
                <td><strong>${reserva.nombre}</strong></td>
                <td>${reserva.telefono}<br><small style="color:gray">${reserva.email}</small></td>
                <td><span class="badge">${reserva.personas}</span></td>
                <td>${fechaTexto} <br> <strong>${horaTexto} hrs</strong></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function aplicarFiltros() {
        const fechaInput = document.getElementById('filtro-fecha').value; // Formato YYYY-MM-DD
        const horarioFiltro = document.getElementById('filtro-horario').value;

        let filtradas = todasLasReservas.filter(reserva => {
            // reserva.fechaHora viene como "2026-10-15T13:00:00"
            const fechaReservaStr = reserva.fechaHora.split('T')[0];
            const horaReservaStr = reserva.fechaHora.split('T')[1];
            const horaNum = parseInt(horaReservaStr.split(':')[0]);

            // 1. Filtrar por fecha si se seleccionó una
            if (fechaInput && fechaReservaStr !== fechaInput) {
                return false;
            }

            // 2. Filtrar por bloque horario
            if (horarioFiltro === 'manana' && (horaNum < 8 || horaNum >= 12)) return false;
            if (horarioFiltro === 'tarde' && (horaNum < 12 || horaNum >= 18)) return false;
            if (horarioFiltro === 'noche' && (horaNum < 18 || horaNum > 22)) return false;

            return true;
        });

        mostrarEnTabla(filtradas);
    }

    function limpiarFiltros() {
        document.getElementById('filtro-fecha').value = '';
        document.getElementById('filtro-horario').value = '';
        mostrarEnTabla(todasLasReservas);
    }

    // Cargar datos al abrir
    cargarReservaciones();
</script>
</body>
</html>
