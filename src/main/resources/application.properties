spring.application.name=reservaciones

# Base de datos PostgreSQL (Leyendo directamente la variable de entorno de Render)
spring.datasource.url=jdbc:${DATABASE_URL}?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver

# Si pruebas local, descomenta las dos de abajo y comenta la de arriba temporalmente:
#spring.datasource.url=jdbc:postgresql://localhost:5432/armandos_db
#spring.datasource.username=postgres
#spring.datasource.password=Admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

# Configuración de Correo (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
